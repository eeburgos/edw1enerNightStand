<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Nightstand StandBy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            color: #fff;
        }

        /* Fullscreen Photo Background & Blur Layers */
        #photo-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
        }

        .blur-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            -webkit-filter: blur(40px) brightness(0.6);
            filter: blur(40px) brightness(0.6);
            transform: scale(1.1);
            z-index: 0;
        }

        /* Subtle Dark Gradient Overlay for Readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* Main Dashboard Grid Layout */
        .dashboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            padding: 40px;
            gap: 30px;
        }

        /* Top-Left: Floating Clock & Weather (No Opaque Block) */
        .top-left-group {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .clock-time {
            font-size: 6.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .clock-date {
            font-size: 1.5rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .weather-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
        }

        .weather-icon {
            font-size: 2rem;
        }

        /* Bottom-Right: Calendar Container (Opaque Frosted Glass) */
        .calendar-container {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            align-self: flex-end;
            justify-self: flex-end;
            width: 380px;
            background: rgba(28, 28, 30, 0.65);
            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .calendar-header {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #ff9f0a; /* Apple calendar accent orange */
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .event-item {
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 14px;
            border-radius: 12px;
            border-left: 4px solid #0a84ff;
        }

        .event-time {
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 2px;
        }

        .event-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* Settings Button */
        .settings-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        /* Settings Modal Overlay */
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1c1c1e;
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }

        .setting-group input, .setting-group select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            background: #0a84ff;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
        }

        .file-input-wrapper input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-primary {
            background: #30d158;
            color: #000;
        }

        #photo-count-status {
            font-size: 0.85rem;
            color: #30d158;
        }
    </style>
</head>
<body>

    <!-- Blurred Backdrop for Vertical Photos -->
    <div id="blur-bg" class="blur-backdrop"></div>
    <!-- Main Photo Frame Display -->
    <div id="photo-container"></div>
    <div class="overlay"></div>

    <!-- Settings Gear Button -->
    <button class="settings-btn" onclick="openSettings()">⚙</button>

    <!-- Dashboard UI Elements -->
    <div class="dashboard">
        <!-- Floating Top-Left Clock & Weather -->
        <div class="top-left-group">
            <div id="clock" class="clock-time">00:00</div>
            <div id="date" class="clock-date">Loading date...</div>
            <div class="weather-widget">
                <span id="weather-icon" class="weather-icon">⛅</span>
                <span id="weather-temp">--°F</span>
            </div>
        </div>

        <!-- Bottom-Right Calendar Container -->
        <div class="calendar-container">
            <div class="calendar-header">
                <span id="cal-header-title">Today's Schedule</span>
                <span style="font-size: 0.9rem;" id="cal-date-short">--</span>
            </div>
            <div id="event-list" class="event-list">
                <div class="event-item">
                    <span class="event-time">All Day</span>
                    <span class="event-title">No upcoming events</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Nightstand Settings</div>
            
            <div class="setting-group">
                <label>Manage Local Photo Library (Saved Permanently on Device)</label>
                <div class="file-input-wrapper">
                    Select Photos from Library
                    <input type="file" id="photo-file-input" accept="image/*" multiple onchange="handleImageUpload(event)">
                </div>
                <div id="photo-count-status">0 permanent photos loaded</div>
            </div>

            <div class="setting-group">
                <label>Slideshow Speed</label>
                <select id="slideshow-interval">
                    <option value="30000">30 Seconds</option>
                    <option value="60000">1 Minute</option>
                    <option value="300000" selected>5 Minutes</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Location (for Weather)</label>
                <input type="text" id="setting-location" value="Los Angeles">
            </div>

            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-primary" onclick="saveSettings()">Save & Apply</button>
            </div>
        </div>
    </div>

    <script>
        // IndexedDB Local Storage Setup for Photos
        let db;
        let localPhotos = [];
        let currentPhotoIndex = 0;
        let slideshowTimer = null;

        function initDB() {
            const request = indexedDB.OpenDBRequest ? indexedDB.open("NightstandPhotosDB", 1) : indexedDB.open("NightstandPhotosDB", 1);
            request.onerror = function(event) {
                console.error("IndexedDB error:", event);
            };
            request.onupgradeneeded = function(event) {
                db = event.target.result;
                if (!db.objectStoreNames.contains("photos")) {
                    db.createObjectStore("photos", { keyPath: "id", autoIncrement: true });
                }
            };
            request.onsuccess = function(event) {
                db = event.target.result;
                loadPhotosFromDB();
            };
        }

        function loadPhotosFromDB() {
            const transaction = db.transaction(["photos"], "readonly");
            const store = transaction.objectStore("photos");
            const request = store.getAll();
            request.onsuccess = function(event) {
                localPhotos = event.target.result;
                updatePhotoCountUI();
                if (localPhotos.length > 0) {
                    showNextPhoto();
                    startSlideshow();
                } else {
                    // Default gradient placeholder if no photos loaded yet
                    document.getElementById('photo-container').style.backgroundImage = 'linear-gradient(45deg, #111, #333)';
                }
            };
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            const transaction = db.transaction(["photos"], "readwrite");
            const store = transaction.objectStore("photos");

            let addedCount = 0;
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    store.add({ data: e.target.result, timestamp: Date.now() });
                    addedCount++;
                    if (addedCount === files.length) {
                        setTimeout(loadPhotosFromDB, 300);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function updatePhotoCountUI() {
            const status = document.getElementById('photo-count-status');
            if (status) {
                status.innerText = `${localPhotos.length} permanent photos stored on device`;
            }
        }

        function showNextPhoto() {
            if (localPhotos.length === 0) return;
            const photoObj = localPhotos[currentPhotoIndex];
            const container = document.getElementById('photo-container');
            const blurBg = document.getElementById('blur-bg');

            container.style.backgroundImage = `url('${photoObj.data}')`;
            blurBg.style.backgroundImage = `url('${photoObj.data}')`;

            currentPhotoIndex = (currentPhotoIndex + 1) % localPhotos.length;
        }

        function startSlideshow() {
            if (slideshowTimer) clearInterval(slideshowTimer);
            const intervalSetting = document.getElementById('slideshow-interval').value;
            slideshowTimer = setInterval(showNextPhoto, parseInt(intervalSetting));
        }

        // Clock and Date Engine
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            const minutesFormatted = minutes < 10 ? '0' + minutes : minutes;

            document.getElementById('clock').innerText = `${hours}:${minutesFormatted}`;
            
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', options);
            document.getElementById('cal-date-short').innerText = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Simulated Live Weather (Los Angeles Default)
        function updateWeather() {
            // Simulated clean weather fetch
            document.getElementById('weather-temp').innerText = "72°F";
            document.getElementById('weather-icon').innerText = "☀️";
        }
        updateWeather();

        // Modal Controls
        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            closeSettings();
            startSlideshow();
        }

        // Initialize database on load
        window.onload = function() {
            initDB();
        };
    </script>
</body>
</html>
